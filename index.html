<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form Editor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="editor-container">
        <aside id="toolbar">
            <div class="toolbar-section">
                <h3>Elements</h3>
                <div id="draggable-elements">
                    <!-- Draggable form elements will be listed here -->
                    <div class="draggable-element" draggable="true" data-type="text-input">Text Input</div>
                    <div class="draggable-element" draggable="true" data-type="password-input">Password Input</div>
                    <div class="draggable-element" draggable="true" data-type="button">Button</div>
                    <div class="draggable-element" draggable="true" data-type="label">Label</div>
                </div>
            </div>
            <div class="toolbar-section">
                <h3>Page Settings</h3>
                <div id="page-settings">
                    <h4>Solid Color</h4>
                    <label for="page-bg-color">Page BG Color:</label>
                    <input type="color" id="page-bg-color" value="#eef1f5"> <!-- Match default body bg -->

                    <h4 class="setting-subheader">Gradient</h4>
                    <label for="page-gradient-color1">Color 1:</label>
                    <input type="color" id="page-gradient-color1" value="#accbee">
                    <label for="page-gradient-color2">Color 2:</label>
                    <input type="color" id="page-gradient-color2" value="#e7f0fd">
                    <label for="page-gradient-angle">Angle (deg):</label>
                    <input type="number" id="page-gradient-angle" value="90" min="0" max="360" step="1">
                    <button id="apply-page-gradient" class="setting-button">Apply Page Gradient</button>

                    <h4 class="setting-subheader">Image</h4>
                    <label for="page-bg-image">Upload Image:</label>
                    <input type="file" id="page-bg-image" accept="image/*">
                    <!-- No apply button needed for file input, will apply on change.
                         Advanced controls like size/repeat could be added here. -->

                    <button id="clear-page-bg" class="setting-button clear-button" style="margin-top:10px;">Clear Page BG</button>
                </div>
            </div>
            <div class="toolbar-section">
                <h3>Form Settings</h3>
                <div id="form-settings">
                     <h4>Solid Color</h4>
                     <label for="form-bg-color">Form BG Color:</label>
                     <input type="color" id="form-bg-color" value="#ffffff">

                     <h4 class="setting-subheader">Gradient</h4>
                     <label for="form-gradient-color1">Color 1:</label>
                     <input type="color" id="form-gradient-color1" value="#f8f9fa">
                     <label for="form-gradient-color2">Color 2:</label>
                     <input type="color" id="form-gradient-color2" value="#e9ecef">
                     <label for="form-gradient-angle">Angle (deg):</label>
                     <input type="number" id="form-gradient-angle" value="90" min="0" max="360" step="1">
                     <button id="apply-form-gradient" class="setting-button">Apply Form Gradient</button>

                     <h4 class="setting-subheader">Image</h4>
                     <label for="form-bg-image">Upload Image:</label>
                     <input type="file" id="form-bg-image" accept="image/*">

                     <button id="clear-form-bg" class="setting-button clear-button" style="margin-top:10px;">Clear Form BG</button>
                </div>
            </div>
             <div class="toolbar-section">
                <h3>Icon Settings</h3>
                <div id="icon-settings">
                    <p>Click an icon to add:</p>
                    <div id="icon-palette">
                        <!-- Icons will be added here by JS -->
                    </div>
                </div>
            </div>
        </aside>
        <main id="canvas">
            <div id="login-form-container">
                <!-- The user-designed login form will appear here -->
                <p>Drag elements here to build your form</p>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
